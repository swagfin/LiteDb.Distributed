<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiteDb.Distributed.Studio</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="LiteDb.Distributed.Studio.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="loading-shell">
            <div class="loading-orb"></div>
            <p>Loading LiteDb.Distributed Studio...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">x</a>
    </div>

    <script>
        window.studioClipboard = {
            copyText: async function (text) {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return;
                }

                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.setAttribute("readonly", "");
                textArea.style.position = "fixed";
                textArea.style.left = "-9999px";
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand("copy");
                document.body.removeChild(textArea);
            }
        };

        window.studioJsonEditor = (function () {
            let editor;
            let changeSubscription;
            let monacoReady;

            function loadMonaco() {
                if (window.monaco) {
                    return Promise.resolve(window.monaco);
                }

                if (monacoReady) {
                    return monacoReady;
                }

                monacoReady = new Promise((resolve, reject) => {
                    const loader = document.createElement("script");
                    loader.src = "https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js";
                    loader.onload = function () {
                        window.require.config({
                            paths: {
                                vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs"
                            }
                        });

                        window.require(["vs/editor/editor.main"], function () {
                            resolve(window.monaco);
                        });
                    };
                    loader.onerror = function () {
                        reject(new Error("Monaco editor failed to load."));
                    };
                    document.body.appendChild(loader);
                });

                return monacoReady;
            }

            function defineTheme(monaco) {
                monaco.editor.defineTheme("github-dark-lite", {
                    base: "vs-dark",
                    inherit: true,
                    rules: [
                        { token: "string.key.json", foreground: "79c0ff" },
                        { token: "string.value.json", foreground: "a5d6ff" },
                        { token: "number", foreground: "79c0ff" },
                        { token: "keyword", foreground: "ff7b72" }
                    ],
                    colors: {
                        "editor.background": "#0d1117",
                        "editor.foreground": "#e6edf3",
                        "editor.lineHighlightBackground": "#161b22",
                        "editorLineNumber.foreground": "#6e7681",
                        "editorCursor.foreground": "#58a6ff",
                        "editor.selectionBackground": "#1f6feb55",
                        "editorIndentGuide.background": "#30363d",
                        "editorIndentGuide.activeBackground": "#8b949e",
                        "editorWidget.background": "#161b22",
                        "editorWidget.border": "#30363d"
                    }
                });
            }

            return {
                init: async function (elementId, value, readOnly, dotNetRef) {
                    const monaco = await loadMonaco();
                    const element = document.getElementById(elementId);
                    if (!element) {
                        return;
                    }

                    if (editor) {
                        this.dispose();
                    }

                    defineTheme(monaco);

                    monaco.languages.json.jsonDefaults.setDiagnosticsOptions({
                        validate: true,
                        allowComments: false,
                        trailingCommas: "error"
                    });

                    editor = monaco.editor.create(element, {
                        value: value || "",
                        language: "json",
                        theme: "github-dark-lite",
                        automaticLayout: true,
                        readOnly: !!readOnly,
                        minimap: { enabled: false },
                        scrollBeyondLastLine: false,
                        wordWrap: "on",
                        tabSize: 4,
                        fontSize: 13,
                        lineHeight: 21,
                        fontFamily: "ui-monospace, SFMono-Regular, SFMono, Consolas, 'Liberation Mono', Menlo, monospace",
                        padding: { top: 14, bottom: 14 },
                        overviewRulerBorder: false,
                        renderLineHighlight: "line",
                        fixedOverflowWidgets: true
                    });

                    changeSubscription = editor.onDidChangeModelContent(function () {
                        dotNetRef.invokeMethodAsync("OnJsonEditorChanged", editor.getValue());
                    });

                    setTimeout(function () {
                        editor.layout();
                        editor.focus();
                    }, 0);
                },
                getValue: function () {
                    return editor ? editor.getValue() : "";
                },
                setValue: function (value) {
                    if (!editor) {
                        return;
                    }

                    editor.setValue(value || "");
                    editor.getAction("editor.action.formatDocument").run();
                },
                layout: function () {
                    if (editor) {
                        setTimeout(function () {
                            editor.layout();
                        }, 0);
                    }
                },
                dispose: function () {
                    if (changeSubscription) {
                        changeSubscription.dispose();
                        changeSubscription = null;
                    }

                    if (editor) {
                        editor.dispose();
                        editor = null;
                    }
                }
            };
        })();

        window.studioQueryEditor = (function () {
            let editor;
            let changeSubscription;
            let completionProvider;
            let monacoReady;
            let completionData = { tables: [], columns: [], selectedTable: "" };
            let liteQlRegistered = false;

            const keywords = [
                "SELECT", "FROM", "WHERE", "LIMIT", "ORDER", "BY", "GROUP", "HAVING", "INSERT", "INTO",
                "VALUES", "UPDATE", "SET", "DELETE", "AND", "OR", "NOT", "LIKE", "BETWEEN", "IN", "IS",
                "NULL", "TRUE", "FALSE", "ASC", "DESC", "DISTINCT", "COUNT", "MIN", "MAX", "SUM", "AVG"
            ];

            function loadMonaco() {
                if (window.monaco) {
                    return Promise.resolve(window.monaco);
                }

                if (monacoReady) {
                    return monacoReady;
                }

                monacoReady = new Promise((resolve, reject) => {
                    const loader = document.createElement("script");
                    loader.src = "https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js";
                    loader.onload = function () {
                        window.require.config({
                            paths: {
                                vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs"
                            }
                        });

                        window.require(["vs/editor/editor.main"], function () {
                            resolve(window.monaco);
                        });
                    };
                    loader.onerror = function () {
                        reject(new Error("Monaco editor failed to load."));
                    };
                    document.body.appendChild(loader);
                });

                return monacoReady;
            }

            function registerLiteQl(monaco) {
                if (liteQlRegistered) {
                    return;
                }

                monaco.languages.register({ id: "liteql" });
                monaco.languages.setLanguageConfiguration("liteql", {
                    comments: {
                        lineComment: "--"
                    },
                    brackets: [
                        ["(", ")"],
                        ["[", "]"]
                    ],
                    autoClosingPairs: [
                        { open: "'", close: "'" },
                        { open: "\"", close: "\"" },
                        { open: "(", close: ")" },
                        { open: "[", close: "]" }
                    ],
                    surroundingPairs: [
                        { open: "'", close: "'" },
                        { open: "\"", close: "\"" },
                        { open: "(", close: ")" },
                        { open: "[", close: "]" }
                    ]
                });

                monaco.languages.setMonarchTokensProvider("liteql", {
                    ignoreCase: true,
                    keywords,
                    tokenizer: {
                        root: [
                            [/--.*$/, "comment"],
                            [/'([^'\\]|\\.)*$/, "string.invalid"],
                            [/'/, "string", "@stringSingle"],
                            [/"([^"\\]|\\.)*$/, "string.invalid"],
                            [/"/, "string", "@stringDouble"],
                            [/\b\d+(\.\d+)?\b/, "number"],
                            [/[()[\],.;]/, "delimiter"],
                            [/[=<>!~]+/, "operator"],
                            [/[a-zA-Z_$][\w$]*/, {
                                cases: {
                                    "@keywords": "keyword",
                                    "@default": "identifier"
                                }
                            }]
                        ],
                        stringSingle: [
                            [/[^\\']+/, "string"],
                            [/\\./, "string.escape"],
                            [/'/, "string", "@pop"]
                        ],
                        stringDouble: [
                            [/[^\\"]+/, "string"],
                            [/\\./, "string.escape"],
                            [/"/, "string", "@pop"]
                        ]
                    }
                });

                completionProvider = monaco.languages.registerCompletionItemProvider("liteql", {
                    triggerCharacters: [" ", ".", "$"],
                    provideCompletionItems: function () {
                        const suggestions = [];

                        keywords.forEach(function (keyword) {
                            suggestions.push({
                                label: keyword,
                                kind: monaco.languages.CompletionItemKind.Keyword,
                                insertText: keyword
                            });
                        });

                        completionData.tables.forEach(function (table) {
                            suggestions.push({
                                label: table,
                                kind: monaco.languages.CompletionItemKind.Class,
                                insertText: table,
                                detail: "table"
                            });
                        });

                        completionData.columns.forEach(function (column) {
                            suggestions.push({
                                label: column,
                                kind: monaco.languages.CompletionItemKind.Field,
                                insertText: column,
                                detail: "field"
                            });
                        });

                        if (completionData.selectedTable) {
                            suggestions.push({
                                label: "SELECT current table",
                                kind: monaco.languages.CompletionItemKind.Snippet,
                                insertText: "SELECT $ FROM " + completionData.selectedTable + " LIMIT 100",
                                detail: "snippet"
                            });
                        }

                        return { suggestions };
                    }
                });

                liteQlRegistered = true;
            }

            function defineTheme(monaco) {
                monaco.editor.defineTheme("github-dark-liteql", {
                    base: "vs-dark",
                    inherit: true,
                    rules: [
                        { token: "keyword", foreground: "ff7b72", fontStyle: "bold" },
                        { token: "identifier", foreground: "e6edf3" },
                        { token: "string", foreground: "a5d6ff" },
                        { token: "number", foreground: "79c0ff" },
                        { token: "comment", foreground: "8b949e", fontStyle: "italic" },
                        { token: "operator", foreground: "d2a8ff" }
                    ],
                    colors: {
                        "editor.background": "#0d1117",
                        "editor.foreground": "#e6edf3",
                        "editor.lineHighlightBackground": "#161b22",
                        "editorLineNumber.foreground": "#6e7681",
                        "editorCursor.foreground": "#58a6ff",
                        "editor.selectionBackground": "#1f6feb55",
                        "editorIndentGuide.background": "#30363d",
                        "editorIndentGuide.activeBackground": "#8b949e",
                        "editorWidget.background": "#161b22",
                        "editorWidget.border": "#30363d"
                    }
                });
            }

            return {
                init: async function (elementId, value, data, dotNetRef) {
                    const monaco = await loadMonaco();
                    const element = document.getElementById(elementId);
                    if (!element) {
                        return;
                    }

                    if (editor) {
                        this.dispose();
                    }

                    completionData = data || completionData;
                    defineTheme(monaco);
                    registerLiteQl(monaco);

                    editor = monaco.editor.create(element, {
                        value: value || "",
                        language: "liteql",
                        theme: "github-dark-liteql",
                        automaticLayout: true,
                        minimap: { enabled: false },
                        scrollBeyondLastLine: false,
                        wordWrap: "on",
                        tabSize: 4,
                        fontSize: 13,
                        lineHeight: 21,
                        fontFamily: "ui-monospace, SFMono-Regular, SFMono, Consolas, 'Liberation Mono', Menlo, monospace",
                        padding: { top: 12, bottom: 12 },
                        overviewRulerBorder: false,
                        renderLineHighlight: "line",
                        fixedOverflowWidgets: true
                    });

                    editor.addAction({
                        id: "run-liteql-query",
                        label: "Run LiteQL Query",
                        keybindings: [monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter],
                        run: function () {
                            dotNetRef.invokeMethodAsync("RunLiteQlFromEditor");
                        }
                    });

                    changeSubscription = editor.onDidChangeModelContent(function () {
                        dotNetRef.invokeMethodAsync("OnLiteQlEditorChanged", editor.getValue());
                    });

                    setTimeout(function () {
                        editor.layout();
                    }, 0);
                },
                getValue: function () {
                    return editor ? editor.getValue() : "";
                },
                setValue: function (value) {
                    if (editor) {
                        editor.setValue(value || "");
                    }
                },
                setCompletionData: function (data) {
                    completionData = data || completionData;
                },
                layout: function () {
                    if (editor) {
                        setTimeout(function () {
                            editor.layout();
                        }, 0);
                    }
                },
                dispose: function () {
                    if (changeSubscription) {
                        changeSubscription.dispose();
                        changeSubscription = null;
                    }

                    if (editor) {
                        editor.dispose();
                        editor = null;
                    }
                }
            };
        })();
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
